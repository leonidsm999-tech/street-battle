name: Build Fabric Mod

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Convert battle theme MP3 to OGG Vorbis
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          mkdir -p src/main/resources/assets/bazarmod/sounds
          if [ -f "raw_audio/battle_theme.mp3" ]; then
            ffmpeg -y -i raw_audio/battle_theme.mp3 -vn -acodec libvorbis -ar 44100 -ac 2 -q:a 5 src/main/resources/assets/bazarmod/sounds/battle_theme.ogg
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build Mod JAR
        run: gradle build

      - name: Upload Mod JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bazar-battle-1.21.1-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
